pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,html,md,yml,yaml}"
      run: bunx oxfmt --check {staged_files}

    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: bunx oxlint {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: bunx tsc
