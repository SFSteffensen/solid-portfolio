name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

  # the single check that branch protection requires, so jobs can be
  # added or renamed without touching the protection settings
  ci-passed:
    name: CI passed
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
